name: CI

on:
  push:
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # No automated test suite exists (PyQt6 GUI app, tested manually).
      # This verifies every module is at least syntactically valid.
      - run: python -m py_compile app.py pdf_unlocker.py themes.py version.py updater.py
